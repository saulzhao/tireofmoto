name: IndexNow
on:
  push:
    branches: [main]
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for Cloudflare Pages build
        run: sleep 300
      - name: Submit sitemap URLs
        run: node scripts/indexnow.mjs
